<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#fff;font-family:'Space Grotesk','Liberation Sans',Arial,sans-serif;color:#0b0b0c;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(11,11,12,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,12,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%)}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:#e10600;filter:blur(120px);opacity:.14;top:-140px;right:-120px}
.wrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:100%;padding:0 96px}
.logo{width:560px;height:auto;margin-bottom:34px}
h1{font-size:64px;line-height:1.02;letter-spacing:-.035em;margin:0 0 20px;max-width:14ch}
h1 em{font-style:normal;color:#e10600}
p{font-family:'Inter',Arial,sans-serif;font-weight:500;font-size:26px;color:#6b6b76;margin:0}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <img class="logo" src="../brand/rocket-B-brand.svg" alt="">
  <h1>Professional websites<br>from <em>£250.</em></h1>
  <p>One payment. Live in seven days. No monthly fees. You own everything.</p>
</div>
</body></html>
