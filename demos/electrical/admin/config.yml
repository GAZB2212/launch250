# Generated by demos/_build.py — edit _cms.py / _deploy.py, not this file.
backend:
  name: git-gateway
  repo: GAZB2212/launch250
  branch: claude/festive-albattani-iyheb4
  identity_url: https://auth.decapbridge.com/sites/SITE-ID-NOT-SET
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    update: "electrical: {{author-name}} updated the site"
    uploadMedia: "electrical: {{author-name}} added {{path}}"
    deleteMedia: "electrical: {{author-name}} removed {{path}}"

# Handy for developers: run `npx decap-server` in the repo root and the editor
# works against your working copy with no login. Ignored in production.
local_backend: true

media_folder: "demos/electrical/img/uploads"
public_folder: "img/uploads"

# Shrink photos in the browser before they are saved, so a 6 MB phone photo
# lands in the repo as a ~300 KB WebP. SVG logos pass through untouched.
# (_build.py does the same server-side as a safety net for anything that slips past.)
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 2000
  height: null
site_url: https://electrical.250launch.co.uk
display_url: https://electrical.250launch.co.uk
logo_url: https://electrical.250launch.co.uk/img/uploads/logo.svg
locale: en
editor:
  preview: false

collections:
  - name: site
    label: "Marsden Electrical"
    description: "Everything on your website that you can change yourself. Press Publish when you are done; the site updates within a couple of minutes."
    files:
      - name: content
        label: "Text, prices & photos"
        file: "demos/electrical/content.json"
        format: json
        fields:
          - {label: "Business name (first line)", name: brand, widget: string, hint: "Shown large in the header, e.g. Hartley"}
          - {label: "Business name (second line)", name: brand2, widget: string, hint: "Shown under it, e.g. Plumbing & Heating"}
          - {label: "What you do", name: trade, widget: string, hint: "One line, e.g. Plumber & heating engineer"}
          - {label: "Home town", name: town, widget: string, hint: "Where you are based"}
          - {label: "Browser tab title", name: title, widget: string, hint: "What Google shows as the blue link. Keep it under 60 characters."}
          - {label: "Google description", name: desc, widget: text, hint: "The grey text under the blue link. One or two sentences."}
          - {label: "Phone number (as shown)", name: phone, widget: string, hint: "e.g. 01632 960 118"}
          - {label: "Phone number (for tap-to-call)", name: tel, widget: string, hint: "Digits only with +44, e.g. +441632960118"}
          - {label: "Email address", name: email, widget: string}
          - {label: "Opening hours", name: hours, widget: string, hint: "e.g. Mon–Sat 8am–6pm"}
          - {label: "Logo", name: logo, widget: image, required: false, hint: "SVG or PNG. Leave blank to use your name as text."}
          - {label: "Main photo (top of page)", name: hero_photo, widget: image, hint: "Landscape works best. Big photos are shrunk automatically."}
          - {label: "Work photo 1", name: photo1, widget: image, required: false}
          - {label: "Work photo 2", name: photo2, widget: image, required: false}
          - {label: "Small line above the headline", name: eyebrow, widget: string, hint: "e.g. Gas Safe registered · No callout fee"}
          - {label: "Headline", name: h1, widget: string}
          - {label: "Intro paragraph", name: sub, widget: text}
          - {label: "Three trust points", name: trusts, widget: list, hint: "Short, e.g. No callout charge", field: {label: "Point", name: point, widget: string}}
          - {label: "Services heading", name: svc_h, widget: string}
          - {label: "Services intro", name: svc_l, widget: text}
          - label: "Services & prices"
            name: services
            widget: list
            hint: "Add, remove or reorder. The first one is featured at the top of the page."
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - {label: "Service", name: title, widget: string}
              - {label: "Description", name: desc, widget: text, hint: "One or two sentences"}
              - {label: "Price", name: price, widget: string, hint: "e.g. From £75"}
          - {label: "About heading", name: about_h, widget: string}
          - {label: "About paragraph", name: about_p, widget: text}
          - label: "Three numbers"
            name: stats
            widget: list
            hint: "Shown as big figures, e.g. 22 / Years on the tools"
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - {label: "Number", name: value, widget: string}
              - {label: "Label", name: label, widget: string}
          - {label: "Areas covered", name: areas, widget: list, hint: "Towns and districts you work in", field: {label: "Area", name: area, widget: string}}
          - label: "Reviews"
            name: reviews
            widget: list
            hint: "Real reviews only. Use the customer's first name and surname or initial."
            summary: "{{fields.name}}"
            fields:
              - {label: "Review", name: quote, widget: text}
              - {label: "Customer name", name: name, widget: string}
              - {label: "Where they are", name: where, widget: string, hint: "e.g. Heswall"}
          - label: "Questions people ask"
            name: faq
            widget: list
            hint: "Three to five is plenty."
            summary: "{{fields.q}}"
            fields:
              - {label: "Question", name: q, widget: string}
              - {label: "Answer", name: a, widget: text}
