# Netlify build for doggrooming.launch250.co.uk
# In the Netlify site settings set "Package directory" to demos/doggrooming and leave
# "Base directory" as the repo root. Paths below are relative to the repo root.
[build]
  command = "pip install -r demos/requirements.txt && python3 demos/_build.py doggrooming"
  publish = "demos/doggrooming"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- demos/doggrooming demos/_*.py demos/_build_css.py brand"

[build.environment]
  PYTHON_VERSION = "3.11"

# Demo sites are fictional businesses with illustrative reviews. Keep them out
# of Google so they never compete with, or get mistaken for, a real trader.
# (The client template repo does not carry this header.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
